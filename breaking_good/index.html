<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>breaking-good</title>
    
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background-image 0.5s ease;
            background-color: #000;        }
        .bg-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-position: center;
    background-repeat: no-repeat;
    transition: background-image 0.5s ease;
}
        .bg-layer.blur {
    background-size: cover;
    filter: blur(25px); 
    transform: scale(1.1); 
    z-index: 1;
    opacity: 0.6; 
}
.bg-layer.clear {
    background-size: contain; 
    z-index: 2;
}
 
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.3); 
           z-index: 3;
        }

               .container {
            position: relative;
          z-index: 4;
            
            background-color: rgba(0, 0, 0, 0.4); 
                        backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
          
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 90%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .character-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            margin-bottom: 25px;
            display: none;
        }

        
        h2 {
            color: #ffffff;
            margin-top: 0;
            font-weight: 800;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .quote {
            font-size: 24px;
            font-weight: 500;
            font-style: italic;
            color: #f8f9fa;
            margin: 20px 0;
            line-height: 1.6;
            position: relative;

font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;            text-shadow: 1px 1px 6px rgba(0,0,0,0.9);
        }

        .character-name {
            font-weight: 700;
            color: #2ecc71;
            font-size: 19px;
font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin-top: 10px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }

        .episode-info {
            color: #ced4da;
font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-size: 15px;
            margin-top: 5px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }

        button {
            margin-top: 35px;
            padding: 15px 30px;
            font-size: 17px;
            font-weight: 600;
            color: white;
            background-color: #e74c3c;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.4);
        }

        button:hover {
            background-color: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(231, 76, 60, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        .loading {
            font-size: 18px;
            color: #ced4da;
        }

@media (max-width: 600px) {
    .container {
        padding: 25px 15px; /* کمتر کردن فاصله‌های داخلی کادر شیشه‌ای */
        width: 85%;
        border-radius: 15px; /* کمی گردی کمتر برای موبایل */
    }
    
    .character-img {
        width: 110px; /* کوچک‌تر کردن عکس کاراکتر */
        height: 110px;
        margin-bottom: 15px;
    }

    h2 {
        font-size: 20px; /* کوچک‌تر کردن عنوان اصلی */
        margin-bottom: 15px;
    }

    .quote {
        font-size: 18px; /* کوچک‌تر کردن متن دیالوگ تا تو گوشی راحت خوانده بشه */
        margin: 15px 0;
    }

    /* کوچک کردن سایز گیومه‌ها */
    .quote::before { font-size: 25px; }
    .quote::after { font-size: 25px; }

    .character-name {
        font-size: 16px;
    }

    .episode-info {
        font-size: 13px;
    }

    button {
        margin-top: 25px;
        padding: 12px 24px;
        font-size: 15px;
    }
}


        
    </style>
</head>
<body id="page-body">
<div id="bg-blur" class="bg-layer blur"></div>
    <div id="bg-clear" class="bg-layer clear"></div>
    <div class="overlay"></div>

    <div class="container">
        <h2>🙂</h2>
        
        <img id="character-img" class="character-img" src="" alt="عکس کاراکتر">

        <div id="quote-text" class="quote">👇</div>
        <div id="character-name" class="character-name"></div>
        <div id="episode-info" class="episode-info"></div>

        <button id="get-quote-btn">👉👈</button>
    </div>

    <script>
        const BASE_URL = 'https://breakingbad-api.byvaibhav.com';

        const bgBlurElement = document.getElementById('bg-blur');
const bgClearElement = document.getElementById('bg-clear');
        
        const bodyElement = document.getElementById('page-body');
        const characterImgElement = document.getElementById('character-img');
        const quoteTextElement = document.getElementById('quote-text');
        const characterNameElement = document.getElementById('character-name');
        const episodeInfoElement = document.getElementById('episode-info');
        const getQuoteBtn = document.getElementById('get-quote-btn');

        async function getBreakingBadQuote() {
            quoteTextElement.innerHTML = '<span class="loading">در حال دریافت اطلاعات</span>';
            characterNameElement.innerText = "";
            episodeInfoElement.innerText = "";
            characterImgElement.style.display = 'none'; 

            try {
                const response = await fetch(`${BASE_URL}/quotes/random`);

                if (!response.ok) {
                    throw new Error(`خطا در ارتباط با سرور: ${response.status}`);
                }

                const data = await response.json();




                const episodeImageUrl = BASE_URL + data.episode.image_url;
        bgBlurElement.style.backgroundImage = `url('${episodeImageUrl}')`;
        bgClearElement.style.backgroundImage = `url('${episodeImageUrl}')`;


                const characterImageUrl = BASE_URL + data.character.image_url;
                characterImgElement.src = characterImageUrl;
                characterImgElement.style.display = 'block'; 

                quoteTextElement.innerText = data.quote.quote_text;
                characterNameElement.innerText = `${data.character.name}`;
                episodeInfoElement.innerText = `(${data.episode.title} - فصل ${data.episode.season}، قسمت ${data.episode.episode_number})`;

            } catch (error) {
                quoteTextElement.innerHTML = '<span style="color: #ff7675;">متأسفانه مشکلی پیش آمد. لطفا دوباره تلاش کنید.</span>';
                console.error('خطا:', error);
                bodyElement.style.backgroundImage = 'none';
                characterImgElement.style.display = 'none';
                bgBlurElement.style.backgroundImage = 'none';
        bgClearElement.style.backgroundImage = 'none';
    
            }
        }

        getQuoteBtn.addEventListener('click', getBreakingBadQuote);
    </script>

</body>
</html>
