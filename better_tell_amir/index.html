<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body.dark-mode {

        body.dark-mode #status {

        .theme-toggle {
            position: absolute;
            top: 15px;

            margin-top: 0;
            padding: 8px 12px;
            border-radius: 50%;
            font-size: 18px;
            background: #e6e9ef;
            color: #333;
        }
        body.dark-mode .theme-toggle {
            background: #313244;
            color: #fff;
        }
        body { font-family: Tahoma, sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
        textarea { width: 80%; max-width: 400px; height: 150px; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
        button { margin-top: 15px; padding: 10px 20px; background: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #27ae60; }
        #status { margin-top: 15px; color: #555; }
    </style>
    
    <script src="jsencrypt.min.js"></script>
</head>
<body>
    <button id="themeBtn" class="theme-toggle" onclick="toggleTheme()">🌙</button>
    <h2>(:better tell amir</h2>
    <textarea id="messageBox" placeholder="پیام خود را بنویسید..."></textarea><br>
    <button onclick="sendEncryptedMessage()">ارسال امن</button>
    
    <div id="status"></div>

    <script>
        const PUBLIC_KEY = `-----BEGIN PUBLIC KEY-----
MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAvKKponF5Og4x59OaJhCxyq+qiBrd2+mEcSHmUHcjpLcc650/s77ZHti97oamv0yoC1UtBL+QkcWIieQFF72nmgVPGRLsAWC/M1/XrjTAuJn92q5c8WAi7KC1bkTBag76HCep1jN7VOAr3O2HTM3TZ4S9ZKFv68EKLiQPm6whgM6hrIWgK9Z57m7FLqJKXdi8g9tcMsLIQz3/VVnZUry9nqabi1fhajuQ+zErxKUYrpydGnE5XD8CWRPG5KEFVWcNmC6jiK6BHrt02m4ab3Pyi7hkB18/4wGnrWcG5bqGdLnIv43s+JJMXUG4DZuJHXJ7OVX7eMpeD3mHccCi++gfVsPVUug8p0yIQ/0SnA+LHDc0teuuSylMFAqTS5Bw/RdP+LAGb3YSopgBRfOITr2v1C2c0uz91kQKKpOmxrSh4gEFqfxugtBzd/kd3rvttXBLbmVipgrHXwcNbmLQey6ZvBNRiAlzAVvx649eupEyWGLSZTFFfVlMJ9wIL6BXl8rbXpBmUupAJvPWMoY/tM9AYEd6N4Ijz91oIfZ2BLSUTc2n5CypfBvPSSj3OMy/j6CUkBL4OvI8Liw7ijAI8X/mdaEsCO17p6lAwWAf1yH5dGicvnm4rnl/s4GqPZur5udPxO3ExNAuG9t9cHkxpmhBjxuCw/Wj1HswwzQdsVD9vaUCAwEAAQ==
-----END PUBLIC KEY-----`;

        const GOOGLE_APP_URL = "https://script.google.com/macros/s/AKfycbxxcMME_0avMD1hSvOM8wBX6D8TFoj9-KpwHgeIVM6kcGyiB5hN9DMw6uw33dPmHpjF/exec";

         async function hybridEncrypt(text, publicKeyPem) {
  
            const aesKey = await window.crypto.subtle.generateKey(
                { name: "AES-GCM", length: 256 },
                true,
                ["encrypt", "decrypt"]
            );
            const iv = window.crypto.getRandomValues(new Uint8Array(12));

            const encodedText = new TextEncoder().encode(text);
            const encryptedDataBuffer = await window.crypto.subtle.encrypt(
                { name: "AES-GCM", iv: iv },
                aesKey,
                encodedText
            );

            const rawAesKey = await window.crypto.subtle.exportKey("raw", aesKey);
            const aesKeyBase64 = btoa(String.fromCharCode(...new Uint8Array(rawAesKey)));

            const rsaEncryptor = new JSEncrypt();
            rsaEncryptor.setPublicKey(publicKeyPem);
            const encryptedAesKey = rsaEncryptor.encrypt(aesKeyBase64);

            if (!encryptedAesKey) return null;

            const ivBase64 = btoa(String.fromCharCode(...iv));
            const dataBase64 = btoa(String.fromCharCode(...new Uint8Array(encryptedDataBuffer)));

            return `${encryptedAesKey}|${ivBase64}|${dataBase64}`;
        }
        
        async function sendEncryptedMessage() {
            const msg = document.getElementById('messageBox').value;
            const statusDiv = document.getElementById('status');

            if (!msg.trim()) {
                statusDiv.innerText = "لطفاً یک پیام بنویسید.";
                return;
            }


            statusDiv.innerText = "در حال رمزنگاری و ارسال...\nلطفا تا پایان فرایند ارسال منتظر بمانید. ";

            const encryptedData = await hybridEncrypt(msg, PUBLIC_KEY);
            
            if (!encryptedData) {
                statusDiv.innerText = "خطا در رمزنگاری پیام!";
                return;
            }

            try {
                const formData = new URLSearchParams();
                formData.append('message', encryptedData);

                const response = await fetch(GOOGLE_APP_URL, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    }
                });

                const result = await response.json();
                if (result.status === "success") {
                    statusDiv.innerText = "پیام شما با موفقیت و به صورت ناشناس ارسال شد!";
                    document.getElementById('messageBox').value = "";    
                } else {
                    statusDiv.innerText = "خطا در ذخیره پیام.";
                }
            } catch (error) {
                console.error(error);
                statusDiv.innerText = "مشکلی در ارتباط با سرور پیش آمد.";
            }
        }

        
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                document.body.classList.add('dark-mode');
                document.getElementById('themeBtn').innerText = '☀️';
            }
        }
        
        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark-mode');
            document.getElementById('themeBtn').innerText = isDark ? '☀️' : '🌙';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }
        
        window.addEventListener('DOMContentLoaded', initTheme);
    </script>
</body>
</html>
